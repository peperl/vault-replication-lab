global:
  tlsDisable: false

injector:
  enabled: false

csi:
  enabled: false

server:
  image:
    tag: "1.21.2"
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/tls/ca.crt
  volumes:
    - name: tls
      secret:
        secretName: vault-b-tls
  volumeMounts:
    - name: tls
      mountPath: /vault/userconfig/tls
      readOnly: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dataStorage:
    enabled: true
    size: 2Gi
  auditStorage:
    enabled: false
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        cluster_name = "vault-cluster-b"
        disable_mlock = true

        listener "tcp" {
          tls_disable = 0
          tls_cert_file = "/vault/userconfig/tls/tls.crt"
          tls_key_file = "/vault/userconfig/tls/tls.key"
          tls_client_ca_file = "/vault/userconfig/tls/ca.crt"
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
  serviceType: NodePort
  serviceNodePort: 32081
  externalTrafficPolicy: Cluster
